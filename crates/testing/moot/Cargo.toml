[package]
name = "moor-moot"
version = "2.0.0-dev"
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Execute MOO interaction tests described in simple text files."

[dependencies]
# Internal Dependencies
moor-var = { path = "../../var" }

# Compiler & Language Processing
pest.workspace = true
pest_derive.workspace = true

# Error Handling & Logging
eyre.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Terminal & UI (optional dependencies for color support)
anstream = { workspace = true, optional = true }
anstyle = { workspace = true, optional = true }

[features]
colors = ["dep:anstream", "dep:anstyle"]
