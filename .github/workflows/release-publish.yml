name: Release - Publish container images and binaries

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      major_minor: ${{ steps.release.outputs.major_minor }}
      stable: ${{ steps.release.outputs.stable }}
      namespace: ${{ steps.release.outputs.namespace }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              tag="$INPUT_TAG"
          else
              tag="$GITHUB_REF_NAME"
          fi

          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "Release tag is not semantic: $tag" >&2
              exit 1
          fi

          major_minor=${tag%.*}
          if [[ "$tag" == *-* ]]; then
              stable=false
          else
              stable=true
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major_minor" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify source and declared version
        id: commit
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          tag_commit=$(git rev-parse "refs/tags/${TAG}^{commit}")
          checkout_commit=$(git rev-parse HEAD)
          if [[ "$tag_commit" != "$checkout_commit" ]]; then
              echo "Checkout $checkout_commit does not match tag $tag_commit" >&2
              exit 1
          fi

          declared_version=$(jq -r .version package.json)
          if [[ "$declared_version" != "$TAG" ]]; then
              echo "package.json version $declared_version does not match tag $TAG" >&2
              exit 1
          fi

          major=${TAG%%.*}
          release_branch="v${major}.0-release"
          git fetch --no-tags origin \
              "+refs/heads/${release_branch}:refs/remotes/origin/${release_branch}"
          if ! git merge-base --is-ancestor "$checkout_commit" "origin/${release_branch}"; then
              echo "Tag $TAG is not reachable from $release_branch" >&2
              exit 1
          fi

          echo "sha=$checkout_commit" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: prepare
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: moor
            dockerfile: Dockerfile
            target: default
            arch: amd64
            arch_tag: x86_64
            runner: ubuntu-24.04
            build_args: |
              BUILD_PROFILE=release
              CARGO_BUILD_JOBS=4
          - image: moor
            dockerfile: Dockerfile
            target: default
            arch: arm64
            arch_tag: aarch64
            runner: ubuntu-24.04-arm
            build_args: |
              BUILD_PROFILE=release
              CARGO_BUILD_JOBS=4
          - image: moor-frontend
            dockerfile: clients/meadow/Dockerfile
            target: frontend
            arch: amd64
            arch_tag: x86_64
            runner: ubuntu-24.04
            build_args: ''
          - image: moor-frontend
            dockerfile: clients/meadow/Dockerfile
            target: frontend
            arch: arm64
            arch_tag: aarch64
            runner: ubuntu-24.04-arm
            build_args: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Check out release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: true
          pull: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ needs.prepare.outputs.namespace }}/${{ matrix.image }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Attest architecture image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ needs.prepare.outputs.namespace }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  create-manifests:
    name: Publish ${{ matrix.image }} manifest
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        image: [moor, moor-frontend]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Create multi-platform tags
        id: manifest
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.namespace }}/${{ matrix.image }}
          TAG: ${{ needs.prepare.outputs.tag }}
          MAJOR_MINOR: ${{ needs.prepare.outputs.major_minor }}
          STABLE: ${{ needs.prepare.outputs.stable }}
        run: |
          tags=(--tag "${IMAGE}:${TAG}")
          if [[ "$STABLE" == "true" ]]; then
              tags+=(--tag "${IMAGE}:${MAJOR_MINOR}" --tag "${IMAGE}:latest")
          fi

          docker buildx imagetools create \
              "${tags[@]}" \
              "${IMAGE}:${TAG}-x86_64" \
              "${IMAGE}:${TAG}-aarch64"

          digest=$(docker buildx imagetools inspect \
              --format '{{.Manifest.Digest}}' "${IMAGE}:${TAG}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify platforms
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.namespace }}/${{ matrix.image }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          platforms=$(docker buildx imagetools inspect \
              --format '{{json .Manifest.Manifests}}' "${IMAGE}:${TAG}" | jq -r \
              '[.[].platform | select(.os == "linux") | .architecture] | sort | unique | join(",")')
          if [[ "$platforms" != "amd64,arm64" ]]; then
              echo "Unexpected platforms for ${IMAGE}:${TAG}: ${platforms}" >&2
              exit 1
          fi

      - name: Attest multi-platform image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ needs.prepare.outputs.namespace }}/${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  # The GitHub release the binaries are attached to. A tag pushed for the first time gets a draft,
  # so the notes can be written before anyone sees it. A release that already exists is left as it
  # is, and the binaries are added to it.
  draft-release:
    name: Prepare GitHub release
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create a draft release if the tag has none
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          STABLE: ${{ needs.prepare.outputs.stable }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
              echo "Release $TAG already exists."
              exit 0
          fi

          flags=(--draft --verify-tag --title "Release $TAG")
          if [[ "$STABLE" != "true" ]]; then
              flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}" \
              --notes "See ChangeLog.md for what changed in this release."

  # Tarballs of the server programs, for running mooR without containers. The files are copied out
  # of the image built above, so the tarball and the image hold the same binaries.
  binaries:
    name: Package binaries (${{ matrix.arch_tag }})
    needs: [prepare, build, draft-release]
    permissions:
      contents: write
      packages: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each architecture is packaged on its own kind of runner, so that `strip` understands
          # the binaries and they can be run as a check.
          - arch_tag: x86_64
            runner: ubuntu-24.04
          - arch_tag: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tarball
        id: package
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.namespace }}/moor:${{ needs.prepare.outputs.tag }}-${{ matrix.arch_tag }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ARCH_TAG: ${{ matrix.arch_tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          name="moor-${TAG}-linux-${ARCH_TAG}"
          mkdir -p dist

          docker pull --quiet "$IMAGE"
          container=$(docker create "$IMAGE")
          docker cp --quiet "${container}:/moor" "dist/${name}"
          docker rm "$container" > /dev/null

          # Debugging information is most of the size. Function names stay, for crash reports.
          for file in "dist/${name}"/*; do
              if [[ -f "$file" && -x "$file" ]]; then
                  strip --strip-debug "$file"
              fi
          done

          cp LICENSE "dist/${name}/LICENSE"
          cp deploy/release/binaries-README.md "dist/${name}/README.md"

          # The programs must start on this runner and must be the commit that was tagged.
          for program in moor moor-daemon moor-telnet-host moor-web-host moorc; do
              version=$("dist/${name}/${program}" --version)
              echo "$version"
              if [[ "$version" != *"${COMMIT:0:7}"* ]]; then
                  echo "${program} does not report commit ${COMMIT:0:7}" >&2
                  exit 1
              fi
          done

          # Fixed owner, order and timestamps, so the same input gives the same tarball.
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="$(git log -1 --format=%cI)" \
              -C dist -czf "dist/${name}.tar.gz" "$name"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          ls -l dist
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attest tarball
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/${{ steps.package.outputs.name }}.tar.gz

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          gh release upload "$TAG" --clobber \
              "dist/${NAME}.tar.gz" "dist/${NAME}.tar.gz.sha256"
