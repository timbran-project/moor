name: Elle consistency

# Pull requests come from branches in this repository, so the push run covers them.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ELLE_CLI_COMMIT: 65fafcfa939cced8b7d279db1b2a666929885e65

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  consistency:
    name: Isolation histories
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-16 libclang-16-dev swig python3-dev cmake libsodium-dev pkg-config libssl-dev graphviz

      - name: Install Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Restore elle-cli
        id: elle-cli-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/elle-cli/target/elle-cli-standalone.jar
          key: elle-cli-${{ env.ELLE_CLI_COMMIT }}-java21

      - name: Install Leiningen
        if: steps.elle-cli-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: sudo apt-get install --yes leiningen

      - name: Build elle-cli
        if: steps.elle-cli-cache.outputs.cache-hit != 'true'
        run: |
          git init /tmp/elle-cli
          git -C /tmp/elle-cli remote add origin https://github.com/ligurio/elle-cli.git
          git -C /tmp/elle-cli fetch --depth 1 origin "$ELLE_CLI_COMMIT"
          git -C /tmp/elle-cli checkout --detach FETCH_HEAD
          pushd /tmp/elle-cli
          lein deps
          lein uberjar
          popd
          built=$(find /tmp/elle-cli/target -maxdepth 1 -name '*-standalone.jar' -print -quit)
          test -n "$built"
          mv "$built" /tmp/elle-cli/target/elle-cli-standalone.jar

      - name: Build workload generator
        run: cargo build --package moor-model-checker --bin list-append

      - name: Run list-append workload
        run: |
          mkdir -p test-output/elle-graphs
          target/debug/list-append \
            --num-active-keys 10 \
            --num-concurrent-workloads 16 \
            --num-workload-iterations 2000 \
            --output-file test-output/list-append.edn

      - name: Check list-append history
        run: |
          elle_jar=/tmp/elle-cli/target/elle-cli-standalone.jar
          java -jar "$elle_jar" \
            -m list-append \
            -c snapshot-isolation \
            --directory test-output/elle-graphs \
            --plot-format svg \
            --cycle-search-timeout 5000 \
            test-output/list-append.edn | tee test-output/elle-list-append-result.txt
          grep -Eq '[[:space:]]true$' test-output/elle-list-append-result.txt

      - name: Run list-append workload through the scheduler
        run: |
          target/debug/list-append \
            --target scheduler \
            --num-active-keys 10 \
            --num-concurrent-workloads 16 \
            --num-workload-iterations 500 \
            --output-file test-output/list-append-scheduler.edn

      - name: Check list-append scheduler history
        run: |
          elle_jar=/tmp/elle-cli/target/elle-cli-standalone.jar
          java -jar "$elle_jar" \
            -m list-append \
            -c snapshot-isolation \
            test-output/list-append-scheduler.edn | tee test-output/elle-list-append-scheduler-result.txt
          grep -Eq '[[:space:]]true$' test-output/elle-list-append-scheduler-result.txt

      - name: Upload Elle histories and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elle-results
          path: test-output
          if-no-files-found: warn
          retention-days: 14
